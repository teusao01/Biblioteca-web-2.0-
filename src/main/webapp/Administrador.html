<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração | Livraria</title><link rel="stylesheet" href="Style.css"></head>
<body><header class="topbar"><a class="brand" href="Home"><span>📚</span><strong>Livraria</strong></a><nav><a href="Home">Livros</a><a href="Perfil">Meu perfil</a><a href="Usuarios">Leitores</a><a class="active" href="Administrador">Administração</a><a class="logout" href="logout">Sair</a></nav></header>
<main class="page"><section class="panel"><span class="eyebrow">ÁREA RESTRITA · ADMINISTRADOR</span><h1>Gerenciar livros</h1><p>Cadastre novos títulos para a vitrine ou remova livros que não devem mais aparecer no catálogo.</p>
<div class="admin-grid"><div class="stat"><small>Usuários</small><strong id="totalUsuarios">0</strong></div><div class="stat"><small>Livros no catálogo</small><strong id="totalLivros">0</strong></div></div>
<h2 class="section-title">Cadastrar livro</h2>
<form action="Administrador" method="post" class="form admin-form">
<input type="hidden" name="acao" value="cadastrar">
<div class="form-two"><label>Título<input name="titulo" required></label><label>Autor<input name="autor" required></label></div>
<div class="form-two"><label>Categoria<input name="categoria" placeholder="Romance, Fantasia..." required></label><label>Preço<input name="preco" type="number" step="0.01" min="0" required></label></div>
<label>Descrição<textarea name="descricao" rows="3"></textarea></label>
<label>URL da capa<input name="imagem" type="url" placeholder="https://..."></label><label class="check"><input name="disponivel" type="checkbox" checked> Livro disponível para os leitores</label>
<button class="btn" type="submit">Cadastrar livro</button></form>
<h2 class="section-title">Livros cadastrados</h2><div id="listaAdmin" class="admin-list"><p class="empty">Carregando...</p></div>
<div class="actions"><a class="btn secondary" href="Home">Voltar à livraria</a></div>
</section></main>
<script>
function carregar(){fetch('Administrador?modo=dados').then(r=>r.json()).then(d=>{
 document.getElementById('totalUsuarios').textContent=d.totalUsuarios;
 document.getElementById('totalLivros').textContent=d.livros.length;
 const a=document.getElementById('listaAdmin');a.innerHTML='';
 d.livros.forEach(x=>a.insertAdjacentHTML('beforeend',`<article><div><b>${esc(x.titulo)}</b><span>${esc(x.autor)} · ${esc(x.categoria)} · R$ ${x.preco.toFixed(2).replace('.',',')}</span></div><form action="Administrador" method="post"><input type="hidden" name="acao" value="remover"><input type="hidden" name="id" value="${x.id}"><button class="btn danger" onclick="return confirm('Remover este livro do catálogo?')" type="submit">Remover</button></form></article>`));
}).catch(()=>{});}
carregar();
function esc(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
</script></body></html>
